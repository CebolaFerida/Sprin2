<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Clima Local</title>
</head>
<body>
    <h1>Clima na sua Localização</h1>
    <p id="clima">Carregando...</p>

    <script>
        const apiKey = '607fd0fbaee3b2eee57aa54e1e67a67a'; 

        function iniciar() {
            if (navigator.geolocation) {
                // Solicita a geolocalização do usuário
                navigator.geolocation.getCurrentPosition(sucesso, erro);
            } else {
                document.getElementById('clima').innerText = "Geolocalização não suportada.";
            }
        }

        function sucesso(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            buscarClima(lat, lon);
        }

        function erro() {
            document.getElementById('clima').innerText = "Não foi possível obter sua localização.";
        }

        // Função para chamar a API de clima
        async function buscarClima(lat, lon) {
            const url = `https://api.openweathermap.org{lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=pt_br`;
            
            try {
                const resposta = await fetch(url);
                const dados = await resposta.json();
                
                // Exibir na tela
                const temperatura = Math.round(dados.main.temp);
                const descricao = dados.weather[0].description;
                const cidade = dados.name;
                document.getElementById('clima').innerText = `${cidade}: ${temperatura}°C, ${descricao}`;
            } catch (error) {
                document.getElementById('clima').innerText = "Erro ao buscar clima.";
            }
        }

        iniciar();
    </script>
</body>
</html>
